project_id = "ai-interviewer"

[functions.realtime-token]
# Gateway-level JWT check, in addition to the explicit auth.getUser() call in
# the function. Defence in depth: the gateway rejects unsigned callers, and the
# function itself rejects anything that does not resolve to a real user.
verify_jwt = true

[functions.job-link]
# Same posture. This one also fetches a URL of the caller's choosing, so an
# unauthenticated caller must never reach the fetch at all.
verify_jwt = true
