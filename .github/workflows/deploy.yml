name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; queued runs wait rather than cancelling a
# deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build:static
        env:
          # Repository variables, not secrets: both values ship inside the client
          # bundle by design. Row Level Security is the security boundary. If
          # they are unset the demo simply builds without sign-in.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Public Supabase Edge Function URL that mints Realtime client secrets.
          # A URL, never a key — OPENAI_API_KEY lives only in Supabase secrets.
          # Unset until the function is deployed, which simply leaves voice off.
          NEXT_PUBLIC_REALTIME_TOKEN_URL: ${{ vars.NEXT_PUBLIC_REALTIME_TOKEN_URL }}
          # Public Supabase Edge Function URL that imports a job description
          # from a link. Unset simply leaves that field out of the setup screen.
          NEXT_PUBLIC_JOB_LINK_URL: ${{ vars.NEXT_PUBLIC_JOB_LINK_URL }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests against the static export
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
